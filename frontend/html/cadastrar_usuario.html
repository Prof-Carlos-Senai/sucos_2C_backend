<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="../js/cadastrar_usuario.js"defer></script>
    <title>Cadastro Usuário</title>
</head>
<body>
    <header>
        <nav>
            <a href="http://">link</a>
        </nav>
    </header>
    <main>
        <h1>Cadastro do Usuário</h1><br>
        <form>
            <label for="nome">Digite o Nome do Usuário</label><br>
            <input type="text" id="nome"><br><br>

            <label for="email">Digite o Email do Usuário</label><br>
            <input type="text" id="email"><br><br>

            <label for="cpf">Digite o CPF do Usuário</label><br>
            <input type="text" id="cpf"><br><br>

            <label for="telefone">Digite o telefone do Usuário</label><br>
            <input type="text" id="telefone"><br><br>

            <button id="cad_usuario">Cadastrar</button>

        </form>
        <div id="resposta"></div>
    </main>
</body>
</html>
